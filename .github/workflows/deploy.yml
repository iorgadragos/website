name: Deploy site
# Uploads the built site to S3 and invalidates CloudFront.
# Infra changes are deployed separately (`cd infra && npx cdk deploy`) after reviewing `cdk diff`.
# Enable by setting repo variables: AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID (from the stack outputs).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm test && npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload assets (long cache)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages (short cache)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" --cache-control "public,max-age=300"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"
