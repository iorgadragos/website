name: Deploy site
# Uploads the built site to S3 and invalidates CloudFront.
# Infra changes are deployed separately (`cd infra && npx cdk deploy`) after reviewing `cdk diff`.
# Enable by setting repo variables: AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID (from the stack outputs).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm test && npm run build && npm run check:dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '732370035548' # iorgadragos-studio only
      # Order matters: upload new files first (never delete before the new HTML is live), invalidate, then prune.
      - name: Upload fingerprinted assets (1 year, immutable)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "*" --include "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini" --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (5 min)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini" --cache-control "public,max-age=300"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"
      # --size-only: never re-upload here (keeps Cache-Control). Old hashed _astro/* files are kept so cached HTML
      # keeps working; they are cheap and expire as noncurrent versions once overwritten/removed manually.
      - name: Prune files removed from the build (previous versions stay in the versioned bucket for 30 days)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --size-only --exclude "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini"
