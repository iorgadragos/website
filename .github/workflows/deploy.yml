name: Deploy site
# Ships the EXACT build CI tested (#17): the `dist` artifact of a green CI run of main, never a rebuild. So what goes
# live is what CI's unit, e2e, axe and Lighthouse jobs checked. scripts/resolve-deploy.ts decides what to ship:
#   - after CI completes on a push to main (workflow_run): that run, if it succeeded;
#   - workflow_dispatch: the green CI run of main's current HEAD (re-run CI first if its artifact has expired, 7 days);
#   - always main's CURRENT HEAD: a run for an older commit (CI finished out of order, a re-run) ships HEAD's green build
#     instead, or skips if there is none yet. Never a rollback; a cancelled pending run loses nothing.
# Infrastructure is NOT deployed from this repo: it's managed with AWS CLI scripts + a RUNBOOK in the studio ops repo
# (ADR 0011). No CDK. Enabled by repo variables AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID, SITE_URL.
# After the upload, `smoke` runs e2e/live.spec.ts against SITE_URL: it first waits until /version.txt serves this commit,
# then every page under the live CSP, security headers, the rewrite, 404, cache headers.
# If smoke fails, the new version is already live: fix forward, or revert the commit on main (CI, then this, redeploy).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One real deploy at a time, queued in order. A run that can't deploy (a failed CI, a PR or fork run whose head branch
# is also called main, another workflow named CI) gets its own group: GitHub keeps only ONE pending run per group and a
# newly queued run cancels it, so a no-op must never displace a real pending deploy. resolve-deploy.ts re-checks all of
# this (and that the commit is still main's HEAD) inside the lock.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml')) && 'deploy' || format('deploy-noop-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  resolve:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.r.outputs.deploy }}
      run_id: ${{ steps.r.outputs.run_id }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }   # main's workflow + scripts; the shipped files come from the artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - id: r
        run: node scripts/resolve-deploy.ts
        env:
          GH_TOKEN: ${{ github.token }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_PATH: ${{ github.event.workflow_run.path }}
  deploy:
    needs: resolve
    if: ${{ needs.resolve.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read     # download the CI run's artifact
      id-token: write   # OIDC into the deploy role
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      # The artifact must be the build of this commit: check:dist asserts dist/version.txt == BUILD_SHA (and, in CI,
      # never "dev"), plus the usual servability checks. It needs no dependencies (Node type stripping).
      - run: npm run check:dist
        env: { BUILD_SHA: "${{ needs.resolve.outputs.sha }}" }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '732370035548' # iorgadragos-studio only
      # Order matters: upload new files first (never delete before the new HTML is live), invalidate, then prune.
      - name: Upload fingerprinted assets (1 year, immutable)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "*" --include "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini" --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (5 min)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini" --cache-control "public,max-age=300"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"
      # --size-only: never re-upload here (keeps Cache-Control). Old hashed _astro/* files are kept so cached HTML
      # keeps working; they are cheap and expire as noncurrent versions once overwritten/removed manually.
      - name: Prune files removed from the build (previous versions stay in the versioned bucket for 30 days)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --size-only --exclude "_astro/*" --exclude ".DS_Store" --exclude "Thumbs.db" --exclude "desktop.ini"
  smoke:
    # Fails (does not skip) when SITE_URL is missing: a deploy without its smoke test must not look green.
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15   # incl. up to 6 min waiting for the new version at the edge
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:   # the page list comes from the shipped build's sitemap
          name: dist
          path: dist
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live -- --project=desktop-chromium
        env: { LIVE_URL: "${{ vars.SITE_URL }}", EXPECTED_SHA: "${{ needs.resolve.outputs.sha }}" }
