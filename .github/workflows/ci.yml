name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: No CDK/infra code in this repo (ADR 0011)
        run: test ! -e infra && ! git ls-files | grep -E '(^|/)cdk(\.context)?\.(out|json)'
      - run: npm test
      - run: npm run build # includes astro check
      - run: npm run check:dist
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with: { name: dist, path: dist, retention-days: 7 }
  e2e:
    # Playwright on the built site: every page in desktop Chromium/WebKit and Pixel/iPhone emulation, axe (no
    # serious/critical violations), internal links, nav, 404 (iorgadragos/studio#41).
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
  lighthouse:
    # Lighthouse CI budgets: performance, accessibility, best practices and SEO >= 0.95, mobile and desktop presets.
    # Run through a pinned npx (not a devDependency): @lhci/cli's proxy/ftp dependency chain stays out of the lockfile.
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7 }
